services:
  postgres:
    image: postgres:16-alpine
    container_name: prensas-api-postgres
    environment:
      POSTGRES_DB: estoque_prensas
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - prensas-api-postgres-data:/var/lib/postgresql/data

volumes:
  prensas-api-postgres-data:
